<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<style>
{{font}}
{{styles}}
</style>
<script>try { document.documentElement.dataset.theme = localStorage.getItem('kandepo:theme') || ''; } catch {}</script>
</head>
<body>

<header>
  <div class="filters">{{filters}}

    <span class="filter"><label for="f-sort">sort</label>
    <select id="f-sort"><option value="_mtime">recent</option>{{sorts}}<option value="">file</option></select></span>

    <button class="btn" id="f-view" aria-pressed="false">Graph</button>
    <button class="btn" id="f-reset" hidden>Reset</button>
  </div>
  <span class="error" id="notice" role="alert"></span>
  <div class="meta"><h1>{{title}}</h1><span id="count" aria-live="polite"></span>
    <span class="theme" id="theme" role="radiogroup" aria-label="Color mode">
      <label title="System"><input class="visually-hidden" type="radio" name="theme" value="" aria-label="System"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg></label>
      <label title="Light"><input class="visually-hidden" type="radio" name="theme" value="light" aria-label="Light"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></label>
      <label title="Dark"><input class="visually-hidden" type="radio" name="theme" value="dark" aria-label="Dark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></label>
    </span></div>
</header>

<main>
<svg id="graph" class="hidden" aria-label="Graph of the links between tasks"></svg>

<p class="empty-board" id="empty" hidden>No task matches these filters. <button class="btn" id="empty-reset">Reset</button></p>

<div class="board" id="board">
  {{board}}
</div>
</main>

<dialog id="task-dialog" aria-labelledby="dlg-title">
  <div class="dialog-head">
    <h2 id="dlg-title"></h2>
    <div class="fields" id="dlg-fields"></div>
  </div>
  <div class="dialog-body" id="dlg-body"></div>
  <div class="dialog-foot">
    <span class="path" id="dlg-path"></span>
    <button class="btn" id="dlg-back" hidden>← Back</button>
    <span id="dlg-links"></span>
    <span class="error" id="dlg-error" role="alert"></span>
    <button class="btn" id="dlg-close">Close</button>
    <button class="btn primary" id="dlg-open" autofocus>Open in editor</button>
  </div>
</dialog>

<script>
const TASKS = {{tasks}};

const COLUMNS = {{columns}};

const FIELDS = {{fields}};

const SERVER_URL = {{serverUrl}};

{{script}}
</script>
</body>
</html>
